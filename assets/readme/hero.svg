<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">semantic-sketch-collage</title>
  <desc id="desc">把照片事实转化为语义锚点明确的手绘编辑拼贴。</desc>
  <rect width="1200" height="420" rx="28" fill="#F4F1E9"/>
  <path d="M0 70H1200" stroke="#D6D0C5" stroke-width="2"/>
  <text x="52" y="45" fill="#66635E" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="20">PHOTO EDITORIAL SKILL</text>
  <text x="1070" y="45" fill="#66635E" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="20">v1.0.0</text>

  <g id="title-block" transform="translate(52 108)">
    <text x="0" y="64" fill="#111312" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="70" font-weight="800">SEMANTIC</text>
    <text x="0" y="140" fill="#111312" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="70" font-weight="800">SKETCH / COLLAGE</text>
    <text x="2" y="200" fill="#242624" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="27" font-weight="650">让线稿从照片的真实结构继续生长。</text>
    <text x="2" y="242" fill="#6E6A64" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="20">FACTS -&gt; ANCHOR -&gt; EXTEND -&gt; EDIT</text>
  </g>

  <g id="project-method" transform="translate(810 98)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif">
    <rect width="330" height="72" rx="15" fill="#FCFBF7" stroke="#222421" stroke-width="2"/>
    <circle cx="28" cy="36" r="10" fill="#F06D50"/>
    <text x="50" y="30" fill="#74716B" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18">USER PHOTO</text>
    <text x="50" y="54" fill="#111312" font-size="21" font-weight="700">读取可见事实</text>
    <path d="M165 72V95M154 85L165 96L176 85" fill="none" stroke="#222421" stroke-width="2"/>

    <rect y="96" width="330" height="104" rx="15" fill="#111312"/>
    <text x="24" y="128" fill="#98968F" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18">SEMANTIC VISUAL CARD</text>
    <text x="24" y="159" fill="#F7F4EC" font-size="24" font-weight="700">来源 / 锚点 / 构图功能</text>
    <rect x="264" y="126" width="11" height="48" rx="6" fill="#3D6FF2"/>
    <rect x="283" y="126" width="11" height="48" rx="6" fill="#A5F300"/>
    <rect x="302" y="126" width="11" height="48" rx="6" fill="#F3C94B"/>
    <path d="M165 200V223M154 213L165 224L176 213" fill="none" stroke="#222421" stroke-width="2"/>

    <rect y="224" width="330" height="72" rx="15" fill="#FCFBF7" stroke="#222421" stroke-width="2"/>
    <text x="24" y="255" fill="#74716B" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18">EDITORIAL OUTPUT</text>
    <text x="24" y="279" fill="#111312" font-size="21" font-weight="700">照片事实 + 跨界线稿</text>
  </g>
</svg>
